import org.apache.tools.ant.taskdefs.condition.Os
import org.gradle.process.ExecOperations

import javax.inject.Inject

abstract class BallerinaExecHelper {
    @Inject abstract ExecOperations getExecOperations()
}

plugins {
    id 'com.github.spotbugs-base'
    id 'com.gradleup.shadow'
    id 'de.undercouch.download'
    id 'net.researchgate.release'
}

description = 'Ballerina - Salesforce'

allprojects {
    group = project.group
    version = project.version

    apply plugin: 'jacoco'
    jacoco {
        toolVersion = jacocoToolVersion
    }
    apply plugin: 'maven-publish'

    repositories {
        mavenLocal()
        maven {
            url = 'https://maven.wso2.org/nexus/content/repositories/releases/'
        }

        maven {
            url = 'https://mvnrepository.com/artifact/org.testng/testng'
        }

        maven {
            url = 'https://maven.wso2.org/nexus/content/groups/wso2-public/'
        }

        maven {
            url = 'https://repo.maven.apache.org/maven2'
        }

        maven {
            url = 'https://maven.pkg.github.com/ballerina-platform/*'
            credentials {
                username System.getenv("packageUser")
                password System.getenv("packagePAT")
            }
        }
    }

    ext {
        snapshotVersion= '-SNAPSHOT'
        timestampedVersionRegex = '.*-\\d{8}-\\d{6}-\\w.*\$'
        packageName = "salesforce"
    }
}

def moduleVersion = project.version.replace("-SNAPSHOT", "")

def execHelper = project.objects.newInstance(BallerinaExecHelper)

def executeBalCommand(String command, String dir) {
    try {
        execHelper.execOperations.exec {
            workingDir dir
            if (Os.isFamily(Os.FAMILY_WINDOWS)) {
                commandLine 'cmd', '/c', "bal.bat ${command} && exit %%ERRORLEVEL%%"
            } else {
                commandLine 'sh', '-c', "bal ${command}"
            }
        }
    } catch (Exception e) {
        println("bal command failed. " + e.message)
        throw e
    }
}

if (tasks.names.contains('build')) {
    tasks.named('build') {
        dependsOn("${project.packageName}-native:build")
        dependsOn("${project.packageName}-ballerina:build")
        dependsOn("${project.packageName}-examples:build")
    }
} else {
    tasks.register('build') {
        dependsOn("${project.packageName}-native:build")
        dependsOn("${project.packageName}-ballerina:build")
        dependsOn("${project.packageName}-examples:build")
    }
}

release {
    buildTasks = ['build']
    failOnSnapshotDependencies = true
    versionPropertyFile = 'gradle.properties'
    tagTemplate = 'v${version}'
    git {
        requireBranch = "release-${moduleVersion}"
        pushToRemote = 'origin'
    }
}
