import org.gradle.process.ExecOperations

import javax.inject.Inject

abstract class BallerinaExecHelper {
    @Inject abstract ExecOperations getExecOperations()
}

apply plugin: 'java'

description = 'Ballerina - Salesforce Test samples'

def tomlVersion = stripBallerinaExtensionVersion("${project.version}")

def stripBallerinaExtensionVersion(String extVersion) {
    if (extVersion.matches(project.ext.timestampedVersionRegex)) {
        def splitVersion = extVersion.split('-')
        if (splitVersion.length > 3) {
            def strippedValues = splitVersion[0..-4]
            return strippedValues.join('-')
        } else {
            return extVersion
        }
    } else {
        return extVersion.replace("${project.ext.snapshotVersion}", '')
    }
}

// Compiles every example against the locally built connector. Examples are compiled, not run:
// running them needs live Salesforce credentials and the listener examples never exit.
// Skipped when tests are part of the build: the Docker-based test run leaves ballerina/target
// unwritable for build.sh's `bal pack`, and CI already builds the examples with `build -x test`.
task buildExamples {
    def execHelper = project.objects.newInstance(BallerinaExecHelper)
    dependsOn ":${project.packageName}-ballerina:build"

    gradle.taskGraph.whenReady { graph ->
        if (graph.hasTask(":${project.packageName}-examples:test")) {
            buildExamples.enabled = false
        }
    }
    doLast {
        try {
            execHelper.execOperations.exec {
                workingDir project.projectDir
                println("Working dir: ${workingDir}")
                commandLine 'sh', '-c', "chmod +x ./build.sh && ./build.sh build ${tomlVersion}"
            }
        } catch (Exception e) {
            println("Example Build failed: " + e.message)
            throw e
        }
    }
}

build.dependsOn buildExamples
